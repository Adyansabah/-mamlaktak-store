<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم متجر مملكتك</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f7f3f5;color:#222}.login,.wrap{max-width:1100px;margin:35px auto;padding:0 16px}.card,.panel{background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 15px #0001;margin-bottom:18px}.login{max-width:420px}.login h1,.panel h2{color:#a83257}input,select{width:100%;padding:12px;margin:6px 0 10px;border:1px solid #ddd;border-radius:9px;font-family:inherit}.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer}.primary{background:#a83257;color:#fff}.danger{background:#f8dddd;color:#9d2b2b}.edit{background:#f2dce4;color:#8e2848}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff;padding:18px;border-radius:15px}.stat b{display:block;font-size:28px;color:#a83257}.form{display:grid;grid-template-columns:2fr 1fr 1fr 2fr auto;gap:8px;align-items:end}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:right}.thumb{width:55px;height:55px;object-fit:cover;border-radius:8px}.hidden{display:none}.notice{background:#fff7dc;padding:11px;border-radius:10px;color:#6d5900;font-size:13px}.actions{display:flex;gap:5px}@media(max-width:800px){.stats{grid-template-columns:1fr}.form{grid-template-columns:1fr}.table{font-size:12px}}
</style></head><body>
<div id="login" class="login"><div class="card"><h1>🔐 دخول لوحة التحكم</h1><input id="user" placeholder="اسم المستخدم"><input id="pass" type="password" placeholder="كلمة المرور"><button class="btn primary" onclick="login()">دخول</button><p id="err" style="color:#b22"></p></div></div>
<div id="app" class="wrap hidden"><div class="top"><h1>⚙️ لوحة تحكم متجر مملكتك</h1><div><button class="btn edit" onclick="location.href='/'">🛍️ المتجر</button><button class="btn danger" onclick="logout()">خروج</button></div></div>
<div class="stats"><div class="stat">المنتجات<b id="sp">0</b></div><div class="stat">الأقسام<b id="sc">0</b></div><div class="stat">الطلبات<b id="so">0</b></div></div>
<div class="panel"><h2>إدارة المنتجات</h2><div class="form"><div><label>اسم المنتج</label><input id="pn"></div><div><label>السعر</label><input id="pp" type="number" min="0"></div><div><label>القسم</label><select id="pc"></select></div><div><label>اسم ملف الصورة</label><input id="pi"></div><button class="btn primary" onclick="saveProduct()">حفظ</button></div>
<table class="table"><thead><tr><th>الصورة</th><th>المنتج</th><th>السعر</th><th>القسم</th><th>الإجراء</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="panel"><h2>الأقسام</h2><div style="display:flex;gap:8px"><input id="newcat" placeholder="اسم القسم"><button class="btn primary" onclick="addCat()">إضافة</button></div><div id="catrows"></div></div>
<div class="panel"><h2>الطلبات</h2><div id="orders"></div></div></div>
<script>
let token=localStorage.getItem("mamlaktak_admin_token")||"", editId=null, products=[],cats=[],orders=[];
const $=id=>document.getElementById(id), money=n=>Number(n).toLocaleString("ar-IQ");
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};let r=await fetch(url,opt);if(r.status===401){logout();throw 0}let d=await r.json();if(!r.ok)throw new Error(d.error||"حدث خطأ");return d}
async function login(){try{let d=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("user").value,password:$("pass").value})}).then(async r=>{let x=await r.json();if(!r.ok)throw new Error(x.error);return x});token=d.token;localStorage.setItem("mamlaktak_admin_token",token);showApp()}catch(e){$("err").textContent=e.message}}
function logout(){token="";localStorage.removeItem("mamlaktak_admin_token");$("app").classList.add("hidden");$("login").classList.remove("hidden")}
async function showApp(){if(!token)return;try{products=await api("/api/products");cats=await api("/api/categories");orders=await api("/api/orders");$("login").classList.add("hidden");$("app").classList.remove("hidden");render()}catch(e){}}
function render(){ $("sp").textContent=products.length;$("sc").textContent=cats.length;$("so").textContent=orders.length;$("pc").innerHTML=cats.map(c=>`<option>${c}</option>`).join("");$("rows").innerHTML=products.map(p=>`<tr><td><img class="thumb" src="/images/${encodeURIComponent(p.img)}"></td><td>${p.name}</td><td>${p.price?money(p.price)+" د.ع":"عند الطلب"}</td><td>${p.cat}</td><td class="actions"><button class="btn edit" onclick="editProduct(${p.id})">تعديل</button><button class="btn danger" onclick="delProduct(${p.id})">حذف</button></td></tr>`).join("");$("catrows").innerHTML=cats.map(c=>`<div style="padding:9px;border-bottom:1px solid #eee;display:flex;justify-content:space-between">${c}<button class="btn danger" onclick="delCat(${JSON.stringify(c)})">حذف</button></div>`).join("");$("orders").innerHTML=orders.length?orders.map(o=>`<div style="padding:12px;border-bottom:1px solid #eee"><b>#${o.id}</b> — ${o.name} — ${o.phone}<br>${o.address}<br>الإجمالي: ${money(o.total||0)} د.ع</div>`).join(""):"لا توجد طلبات محفوظة."}
async function saveProduct(){try{let body={name:$("pn").value.trim(),price:Number($("pp").value)||0,cat:$("pc").value,img:$("pi").value.trim()};if(!body.name)return alert("أدخل اسم المنتج");let d=editId?await api("/api/products/"+editId,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}):await api("/api/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});products=await api("/api/products");editId=null;$("pn").value=$("pp").value=$("pi").value="";render()}catch(e){alert(e.message)}}
function editProduct(id){let p=products.find(x=>x.id===id);editId=id;$("pn").value=p.name;$("pp").value=p.price;$("pc").value=p.cat;$("pi").value=p.img;scrollTo(0,0)}
async function delProduct(id){if(!confirm("حذف المنتج؟"))return;await api("/api/products/"+id,{method:"DELETE"});products=await api("/api/products");render()}
async function addCat(){let name=$("newcat").value.trim();if(!name)return;try{await api("/api/categories",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});cats=await api("/api/categories");$("newcat").value="";render()}catch(e){alert(e.message)}}
async function delCat(c){if(!confirm("حذف القسم؟"))return;try{await api("/api/categories/"+encodeURIComponent(c),{method:"DELETE"});cats=await api("/api/categories");render()}catch(e){alert(e.message)}}
if(token)showApp();
</script></body></html>
